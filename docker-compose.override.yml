services:
  nginx:
    image: nginx
    container_name: nginx_dev
    build:
      context: ./nginx
      dockerfile: Dockerfile
    volumes:
      - ./nginx/templates:/etc/nginx/templates
      - ./pong:/var/www/pong
      - ./user-management-service/app/uploads:/usr/share/nginx/html/uploads
    depends_on:
      - user-management-service
      - game-management-service
      - ws-service
      - frontend-services
      - frontend-pong-module
      - auth_services
    ports:
      - "${BACKEND_SERVER_SSH_PORT}:443"
      - "${BACKEND_SERVER_PORT}:80"
      - "9090:9090"
    networks:
      - transcendence_network
    restart: unless-stopped
    env_file: .env

# auth-service:
  auth_services:
    build:
      context: ./auth-service
      dockerfile: ./Dockerfile
    container_name: auth_service
    environment:
      - NODE_ENV=development
    depends_on:
      - database-services
    volumes:
      - ./auth-service/app:/app
      - ./auth-service/app/node_modules:/app/node_modules
    networks:
      - transcendence_network

 #user-management-service:     
  user-management-service:
    build:
      context: ./user-management-service
      dockerfile: ./Dockerfile
    container_name: user-management-service
    environment:
      - NODE_ENV=development
    depends_on:
      - database-services
      - auth_services
    volumes:
      - ./user-management-service/app:/app
      - ./user-management-service/app/node_modules:/app/node_modules
    networks:
      - transcendence_network
#game-management-service:     
  game-management-service:
    build:
      context: ./game-management-service
      dockerfile: ./Dockerfile
    container_name: game-management-service
    environment:
      - NODE_ENV=development
    depends_on:
      - database-services
      - auth_services
    volumes:
      - ./game-management-service/app:/app
      - ./game-management-service/app/node_modules:/app/node_modules
    networks:
      - transcendence_network
  
 #webSocket-service:     
  ws-service:
    build:
      context: ./ws-service
      dockerfile: ./Dockerfile
    container_name: ws-service
    environment:
      - NODE_ENV=development
    depends_on:
      - database-services
      - auth_services
    volumes:
      - ./ws-service/app:/app
      - ./ws-service/app/node_modules:/app/node_modules
    networks:
      - transcendence_network
  database-services:
    build:
      context: ./database-service
      dockerfile: ./Dockerfile
    container_name: database-services
    volumes:
      - ./database-service/app:/app #app source code
      - ./database-service/app/node_modules:/app/node_modules #node_modules
    environment:
      - NODE_ENV=development
    restart: always
    networks:
      - transcendence_network

  #frontend_services:
  frontend-services:
    build:
      # context: ./frontend-services
      context: ./frontend-services-myframeworks
      dockerfile: ./Dockerfile
    container_name: frontend-services
    environment:
      - NODE_ENV=development
    volumes:
    #  - ./frontend-services/app:/app
    #  - ./frontend-services/app/node_modules:/app/node_modules
      - ./frontend-services-myframeworks/app:/app
      - ./frontend-services-myframeworks/app/node_modules:/app/node_modules
    networks:
      - transcendence_network
    depends_on:
      - frontend-pong-module

 #Pong-Moudle
  frontend-pong-module:
    build:
      context: ./frontend-pong-module
      dockerfile: ./Dockerfile
    container_name: frontend-pong-module
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend-pong-module/app:/app
      - ./frontend-pong-module/app/node_modules:/app/node_modules
    networks:
      - transcendence_network

# network and volumes
networks:
  transcendence_network:
    driver: bridge

volumes:
  user-management-service_data:
    driver: local
    driver_opts:
      type: none
      device: ./user-management-service/app/build
      o: bind
  databases_data:
    driver: local
    driver_opts:
      type: none
      device: ./databases
      o: bind

  certs_data:
    driver: local
    driver_opts:
      type: none
      device: ./certs
      o: bind