services:
  nginx:
    image: nginx
    container_name: nginx_dev
    build:
      context: ./nginx
      dockerfile: Dockerfile
    volumes:
     # - backend_data:/var/www/html
      - ./nginx/templates:/etc/nginx/templates
  #  depends_on:
  #    - backend_services
    ports:
      - "4433:443"
      - "8080:80"
    networks:
      - transcendence_network
    restart: unless-stopped
    env_file: ./nginx/.env

