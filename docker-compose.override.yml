services:
  nginx:
    image: nginx
    container_name: nginx_dev
    build:
      context: ./nginx
      dockerfile: Dockerfile
    volumes:
      - ./nginx/templates:/etc/nginx/templates
    depends_on:
      - backend_services
    ports:
      - "${BACKEND_SERVER_SSH_PORT}:443"
      - "${BACKEND_SERVER_PORT}:80"
    networks:
      - transcendence_network
    restart: unless-stopped
    env_file: .env

# auth-service:
  auth_services:
    build:
      context: ./auth-service
      dockerfile: ./Dockerfile
    container_name: auth_service
    environment:
      - NODE_ENV=development
    depends_on:
      - sqlite-service
    volumes:
      - ./auth-service/app:/app
      - ./auth-service/app/node_modules:/app/node_modules
    networks:
      - transcendence_network

 #backend_services:     
  backend_services:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    container_name: backend_services
    environment:
      - NODE_ENV=development
    depends_on:
      - sqlite-service
      - auth_services
    volumes:
      - ./backend/app:/app
      - ./backend/app/node_modules:/app/node_modules
    networks:
      - transcendence_network


#ajout d'un service de base de données
  sqlite-service:
    build:
      context: ./sqlite-service
      dockerfile: ./Dockerfile
    container_name: sqlite-service 
    volumes:
      - ./sqlite-service/app:/app #app source code
      - ./sqlite-service/data:/data #database data
      - ./sqlite-service/app/node_modules:/app/node_modules #node_modules
    environment:
      - NODE_ENV=development
    restart: always
    networks:
      - transcendence_network

  database-services:
    build:
      context: ./database-service
      dockerfile: ./Dockerfile
    container_name: database-services
    volumes:
      - ./database-service/app:/app #app source code
      - ./database-service/app/node_modules:/app/node_modules #node_modules
    environment:
      - NODE_ENV=development
    restart: always
    networks:
      - transcendence_network

  #frontend_services:
  exemple-frontend-services:
    build:
      context: ./exemple/exemple-frontend-services
      dockerfile: ./Dockerfile
    container_name: frontend-services-vite
    environment:
      - NODE_ENV=development
    volumes:
      - ./exemple/exemple-frontend-services/app:/app
      - ./exemple/exemple-frontend-services/app/node_modules:/app/node_modules
    networks:
      - transcendence_network


  exemple-component-module:
    build:
      context: ./exemple/exemple-component-module
      dockerfile: ./Dockerfile
    container_name: exemple-component-module
    environment:
      - NODE_ENV=development
    volumes:
      - ./exemple/exemple-component-module/app:/app
      - ./exemple/exemple-component-module/app/node_modules:/app/node_modules
    networks:
      - transcendence_network

# network and volumes
networks:
  transcendence_network:
    driver: bridge
volumes:
  backend_data:
    driver: local
    driver_opts:
      type: none
      device: ./backend/app/build
      o: bind
  databases_data:
    driver: local
    driver_opts:
      type: none
      device: ./databases
      o: bind
  sqlite_data:
    driver: local
    driver_opts:
      type: none
      device: ./sqlite-service/data
      o: bind
  certs_data:
    driver: local
    driver_opts:
      type: none
      device: ./certs
      o: bind