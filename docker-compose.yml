services:
  nginx:
    image: nginx
    container_name: nginx
    build:
      context: ./nginx
      dockerfile: Dockerfile
    volumes:   
      - ./nginx/templates:/etc/nginx/templates
      - ./user-management-service/app/uploads:/usr/share/nginx/html/uploads
    depends_on:
      - user-management-service
      - game-management-service
      - ws-service
      - frontend-services
      - frontend-pong-module
      - auth_services
    ports:
      - "${BACKEND_SERVER_SSH_PORT}:443"
      - "${BACKEND_SERVER_PORT}:80"
    networks:
      - transcendence_network
    restart: unless-stopped
    env_file: .env

# auth-service:
  auth_services:
    build:
      context: ./auth-service
      dockerfile: ./Dockerfile
    container_name: auth_service
    environment:
      - BACKEND_SERVER_URL=${BACKEND_SERVER_BASE_URL}
      - BACKEND_SERVER_WS_URL=${BACKEND_SERVER_BASE_WS_URL}
    depends_on:
      - database-services
    volumes:
      - ./auth-service/app:/app
    networks:
      - transcendence_network
  
   #user-management-service:    
  user-management-service:
    build:
      context: ./user-management-service
      dockerfile: ./Dockerfile
    container_name: user-management-service
    environment:
      - BACKEND_SERVER_URL=${BACKEND_SERVER_BASE_URL}
      - BACKEND_SERVER_WS_URL=${BACKEND_SERVER_BASE_WS_URL}
    depends_on:
      - database-services
      - auth_services
    volumes:
      - ./user-management-service/app:/app
    networks:
      - transcendence_network
#game-management-service:     
  game-management-service:
    build:
      context: ./game-management-service
      dockerfile: ./Dockerfile
    container_name: game-management-service
    environment:
      - BACKEND_SERVER_URL=${BACKEND_SERVER_BASE_URL}
      - BACKEND_SERVER_WS_URL=${BACKEND_SERVER_BASE_WS_URL}
    depends_on:
      - database-services
      - auth_services
    volumes:
      - ./game-management-service/app:/app
    networks:
      - transcendence_network
  
 #webSocket-service:     
  ws-service:
    build:
      context: ./ws-service
      dockerfile: ./Dockerfile
    container_name: ws-service
    environment:
      - BACKEND_SERVER_URL=${BACKEND_SERVER_BASE_URL}
      - BACKEND_SERVER_WS_URL=${BACKEND_SERVER_BASE_WS_URL}
    depends_on:
      - database-services
      - auth_services
    volumes:
      - ./ws-service/app:/app
    networks:
      - transcendence_network
  
#ajout d'un service de base de données
  database-services:
    build:
      context: ./database-service
      dockerfile: ./Dockerfile
    container_name: database-services
    volumes:
      - ./database-service/app:/app #app source code
    restart: always
    networks:
      - transcendence_network

   #frontend_services:
  frontend-services:
    build:
      context: ./frontend-services-myframeworks
      dockerfile: ./Dockerfile
    container_name: frontend-services
    environment:
      - BACKEND_SERVER_NAME=${BACKEND_SERVER_NAME}
      - VITE_BACKEND_SERVER_URL=${BACKEND_SERVER_BASE_URL}
      - VITE_BACKEND_SERVER_WS_URL=${BACKEND_SERVER_BASE_WS_URL}
    volumes:
      - ./frontend-services-myframeworks/app:/app
    networks:
      - transcendence_network
    depends_on:
      - frontend-pong-module

 #Pong-Moudle
  frontend-pong-module:
    build:
      context: ./frontend-pong-module
      dockerfile: ./Dockerfile
    container_name: frontend-pong-module
    environment:
      - BACKEND_SERVER_NAME=${BACKEND_SERVER_NAME}
      - VITE_BACKEND_SERVER_URL=${BACKEND_SERVER_BASE_URL}
      - VITE_BACKEND_SERVER_WS_URL=${BACKEND_SERVER_BASE_WS_URL}
    volumes:
      - ./frontend-pong-module/app:/app
    networks:
      - transcendence_network

# network and volumes
networks:
  transcendence_network:
    driver: bridge
volumes:
  user-management-service_data:
    driver: local
    driver_opts:
      type: none
      device: ./user-management-service/app/build
      o: bind

  certs_data:
    driver: local
    driver_opts:
      type: none
      device: ./certs
      o: bind