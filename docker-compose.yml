services:
  nginx:
    image: nginx
    container_name: nginx
    build:
      context: ./nginx
      dockerfile: Dockerfile
    volumes:   
      - ./nginx/templates:/etc/nginx/templates
    # depends_on:
    #   - backend_services
    ports:
      - "4433:443"
      - "8080:80"
    networks:
      - transcendence_network
    restart: unless-stopped
    env_file: ./nginx/.env

