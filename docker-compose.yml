services:
  nginx:
    image: nginx
    container_name: nginx
    build:
      context: ./nginx
      dockerfile: Dockerfile
    volumes:   
      - ./nginx/templates:/etc/nginx/templates
    depends_on:
      - backend_services
    ports:
      - "${BACKEND_SERVER_SSH_PORT}:443"
      - "${BACKEND_SERVER_PORT}:80"
    networks:
      - transcendence_network
    restart: unless-stopped
    env_file: .env

# auth-service:
  auth_services:
    build:
      context: ./auth-service
      dockerfile: ./Dockerfile
    container_name: auth_service
    depends_on:
      - sqlite-service
    volumes:
      - ./auth-service/app:/app
    networks:
      - transcendence_network
  
   #backend_services:    
  backend_services:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    container_name: backend_services
    depends_on:
      - sqlite-service
      - auth_services
    volumes:
      - ./backend/app:/app
    networks:
      - transcendence_network
  
#ajout d'un service de base de données
  sqlite-service:
    build:
      context: ./sqlite-service
      dockerfile: ./Dockerfile
    container_name: sqlite-service 
    volumes:
      - ./sqlite-service/app:/app #app source code
      - ./sqlite-service/data:/data #database data
    restart: always
    networks:
      - transcendence_network
  database-services:
    build:
      context: ./database-service
      dockerfile: ./Dockerfile
    container_name: database-services
    volumes:
      - ./database-service/app:/app #app source code
      - ./database-service/app/node_modules:/app/node_modules #node_modules
    restart: always
    networks:
      - transcendence_network
# network and volumes
networks:
  transcendence_network:
    driver: bridge
volumes:
  backend_data:
    driver: local
    driver_opts:
      type: none
      device: ./backend/app/build
      o: bind
  databases_data:
    driver: local
    driver_opts:
      type: none
      device: ./databases
      o: bind
  certs_data:
    driver: local
    driver_opts:
      type: none
      device: ./certs
      o: bind