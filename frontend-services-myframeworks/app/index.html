<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong Game</title>
  <link rel="stylesheet" href="/src/css/input.css" />
  <link rel="icon" type="image/x-icon" href="/src/img/react.svg">
  <script >
    // On page load or when changing themes, best to add inline in `head` to avoid FOUC
    if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark')
    }
</script>


</head>
  <div id="app">
    <div class="relative w-full h-screen ">
    <background-canvas-component></background-canvas-component>
      <div class="relative z-10 w-full h-full">
        <navbar-component></navbar-component>
          <app-router>
            
            <!-- page courante injectée dans le router View -->
            <router-view></router-view>
            <popup-cookies></popup-cookies>
          </app-router>
          <is-online-component></is-online-component>
      </div>
    </div>
  </div>

  <script type="module" src="./src/index.ts" defer></script>
  <!-- <script id="tailwind-darkmode" src="/src/js/tailwind-darkmode.js" defer> -->
    <script id="tailwind-darkmode-script"></script>
  </script>
</body>
</html>
