<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pong Game</title>
    <link rel="stylesheet" href="/css/input.css" />
  </head>
  <body class="bg-white text-gray-800">
    <!-- Header with minimalist style -->
    <header class="bg-gray-50 border-b border-gray-200 py-6">
      <div class="container mx-auto flex justify-between items-center px-4">
        <div class="text-2xl font-semibold">Pong Game</div>
        <nav class="flex space-x-6">
          <a href="#game" class="text-gray-600 hover:text-gray-900 transition">Game</a>
          <a href="#login" class="text-gray-600 hover:text-gray-900 transition">Log-In</a>
          <a href="#info" class="text-gray-600 hover:text-gray-900 transition">Info</a>
        </nav>
      </div>
    </header>

    <!-- Main content area -->
    <main class="container mx-auto px-4 py-10">
        <h2 class="font-clash text-4xl font-bold text-indigo-500 text-center mb-8">
            Jouez à Pong !
          </h2>          
      <!-- Centered canvas with a subtle shadow and rounded corners -->
      <div class="flex items-center justify-center">
        <canvas id="pongCanvas" width="1000" height="400" class="shadow-lg rounded-lg"></canvas>
      </div>
    </main>

    <!-- Vite entry point -->
    <script type="module" src="/ts/pong.ts"></script>
  </body>
</html>
