
   location /ws {
        proxy_pass http://ws-service:3000;  
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            
            #  Timeout WebSocket optimisé
            proxy_connect_timeout 60s;
            proxy_send_timeout 43200s;     # 12 heures
            proxy_read_timeout 43200s;     # 12 heures
        
            # Désactiver buffering pour éviter la latence
            proxy_buffering off;
    }

